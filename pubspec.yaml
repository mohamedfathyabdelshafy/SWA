  lottie: ^2.7.0
  marquee: ^2.3.0
  page_transition: ^2.1.0
  pdf: ^3.9.0
  permission_handler: ^11.0.1
  phone_numbers_parser: ^9.0.3
  pin_code_fields: ^8.0.1
  printing: ^5.4.2
  qr_flutter: ^4.1.0
