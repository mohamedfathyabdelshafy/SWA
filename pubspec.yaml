name: swa
description: A new Flutter project.
publish_to: "SWA"

version: 1.2.4+19

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  badges: ^3.1.2
  carousel_slider: ^5.0.0
  circular_countdown_timer: ^0.2.3
  cool_alert: ^2.0.1
  cupertino_icons: ^1.0.2
  dartz: null
  dotted_line: ^3.2.3
  dropdown_textfield: ^1.2.0
  equatable: null
  firebase_core: any
  firebase_messaging: any
  flutter_local_notifications: any
  flutter:
    sdk: flutter
  flutter_bloc: null
  flutter_device_type: ^0.4.0
  flutter_localization: any
  flutter_screenutil: ^5.9.3
  flutter_spinkit: ^5.2.0
  flutter_svg: any
  flutter_timer_countdown: ^1.0.7
  geocoding: ^3.0.0
  geolocator: any
  get_it: null
  google_api_availability: ^5.0.0
  html_unescape: ^2.0.0
  http: null
  http_interceptor: null
  indexed: ^0.0.8
  injectable: null
  internet_connection_checker: null
  intl: any
  jhijri_picker: ^1.0.1
  page_transition: ^2.1.0
  pdf: ^3.9.0
  permission_handler: ^11.0.1
  flutter_html: any
  phone_numbers_parser: ^9.0.3
  pin_code_fields: ^8.0.1
  printing: ^5.4.2
  qr_flutter: ^4.1.0
  salomon_bottom_bar: ^3.3.2
  scroll_loop_auto_scroll: ^0.0.5
  shared_preferences: null
  sizer: any
  url_launcher: ^6.0.13
  webview_flutter: ^4.4.2
  huawei_push: ^6.12.0+303
  device_info_plus: any
  marquee: any
  expandable: ^5.0.1
  intl_phone_field: ^3.2.0
  image_picker: any
  confetti: ^0.8.0


book_my_seat: null
dev_dependencies:
  flutter_lints: any
  flutter_test:
    sdk: flutter
  change_app_package_name: ^1.4.0

flutter_localizations:
  sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/json/
    - assets/fonts/

  fonts:
    - family: bold
      fonts:
        - asset: assets/fonts/NeueHaasGrotesk-Bold.ttf

    - family: regular
      fonts:
        - asset: assets/fonts/NeueHaasGrotesk-Regular.ttf
    - family: meduim
      fonts:
        - asset: assets/fonts/NeueHaasDisplayMediu.ttf
    - family: roman
      fonts:
        - asset: assets/fonts/NeueHaasDisplayRoman.ttf
    - family: black
      fonts:
        - asset: assets/fonts/NeueHaasGrotesk-Black.ttf

    - family: normal
      fonts:
        - asset: assets/fonts/NeueHaasGroteskBloomberg-2c86312d1d9514ad722de70db084b58a.ttf

    - family: Arabic_Medium
      fonts:
        - asset: assets/fonts/arabic_medium.ttf

    - family: Arabic_Bold
      fonts:
        - asset: assets/fonts/arabic_bold.ttf

    - family: Arabic_Regular
      fonts:
        - asset: assets/fonts/arabic_regular.ttf

