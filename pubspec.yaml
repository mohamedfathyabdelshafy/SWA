  flutter_html: ^3.0.0-beta.2
  flutter_local_notifications: ^19.2.1
  flutter_localization: ^0.3.1
  flutter_screenutil: ^5.9.3
  flutter_spinkit: ^5.2.0
  flutter_svg: ^2.0.17
  flutter_timer_countdown: ^1.0.7
